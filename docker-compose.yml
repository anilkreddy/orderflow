name: orderflow

services:
  product-db:
    image: postgres:16-alpine
    container_name: orderflow-product-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: product_pass
    ports:
      - "5433:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    networks:
      - orderflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_user -d product_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:16-alpine
    container_name: orderflow-order-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
    ports:
      - "5434:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - orderflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  customer-db:
    image: postgres:16-alpine
    container_name: orderflow-customer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: customer_user
      POSTGRES_PASSWORD: customer_pass
    ports:
      - "5435:5432"
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    networks:
      - orderflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_user -d customer_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak-db:
    image: postgres:16-alpine
    container_name: orderflow-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_pass
    ports:
      - "5436:5432"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - orderflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.1.0
    container_name: orderflow-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - orderflow-network

  opensearch:
    image: opensearchproject/opensearch:3.0.0
    container_name: orderflow-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - orderflow-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: orderflow-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 5000
    networks:
      - orderflow-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: orderflow-keycloak
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_pass
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./backend/infra/identity-provider:/opt/keycloak/data/import:ro
    networks:
      - orderflow-network

  product-service:
    build:
      context: ./backend
      dockerfile: product-service/Dockerfile
    container_name: orderflow-product-service
    restart: unless-stopped
    depends_on:
      product-db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      PRODUCT_DB_URL: jdbc:postgresql://product-db:5432/product_db
      PRODUCT_DB_USERNAME: product_user
      PRODUCT_DB_PASSWORD: product_pass
      ORDERFLOW_CATALOG_SEED_ENABLED: ${ORDERFLOW_CATALOG_SEED_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_EXTERNAL_ISSUER_URI: http://localhost:8180/realms/oflio
      AUTH_INTERNAL_JWK_SET_URI: http://keycloak:8080/realms/oflio/protocol/openid-connect/certs
    ports:
      - "8081:8081"
    networks:
      - orderflow-network

  order-service:
    build:
      context: ./backend
      dockerfile: order-service/Dockerfile
    container_name: orderflow-order-service
    restart: unless-stopped
    depends_on:
      order-db:
        condition: service_healthy
      product-service:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      ORDER_DB_URL: jdbc:postgresql://order-db:5432/order_db
      ORDER_DB_USERNAME: order_user
      ORDER_DB_PASSWORD: order_pass
      PRODUCT_SERVICE_BASE_URL: http://product-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_EXTERNAL_ISSUER_URI: http://localhost:8180/realms/oflio
      AUTH_INTERNAL_JWK_SET_URI: http://keycloak:8080/realms/oflio/protocol/openid-connect/certs
    ports:
      - "8082:8082"
    networks:
      - orderflow-network

  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    container_name: orderflow-notification-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      NOTIFICATION_EMAIL_ENABLED: "true"
      NOTIFICATION_EMAIL_FROM: no-reply@oflio.local
      NOTIFICATION_EMAIL_REPLY_TO: support@oflio.local
      NOTIFICATION_EMAIL_STORE_NAME: Oflio Commerce
      NOTIFICATION_EMAIL_STOREFRONT_BASE_URL: http://localhost:5173
    ports:
      - "8083:8083"
    networks:
      - orderflow-network

  customer-service:
    build:
      context: ./backend
      dockerfile: customer-service/Dockerfile
    container_name: orderflow-customer-service
    restart: unless-stopped
    depends_on:
      customer-db:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      CUSTOMER_DB_URL: jdbc:postgresql://customer-db:5432/customer_db
      CUSTOMER_DB_USERNAME: customer_user
      CUSTOMER_DB_PASSWORD: customer_pass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      IDENTITY_SERVER_URL: ${IDENTITY_SERVER_URL:-http://keycloak:8080}
      IDENTITY_ADMIN_REALM: master
      IDENTITY_REALM: oflio
      IDENTITY_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      IDENTITY_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      IDENTITY_ADMIN_CLIENT_ID: admin-cli
      IDENTITY_CUSTOMER_DEFAULT_GROUP_PATH: /customers/registered
      AUTH_EXTERNAL_ISSUER_URI: http://localhost:8180/realms/oflio
      AUTH_INTERNAL_JWK_SET_URI: http://keycloak:8080/realms/oflio/protocol/openid-connect/certs
    ports:
      - "8085:8085"
    networks:
      - orderflow-network

  search-service:
    build:
      context: ./backend
      dockerfile: search-service/Dockerfile
    container_name: orderflow-search-service
    restart: unless-stopped
    depends_on:
      product-service:
        condition: service_started
      customer-service:
        condition: service_started
      kafka:
        condition: service_started
      opensearch:
        condition: service_started
    environment:
      PRODUCT_SERVICE_BASE_URL: http://product-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENSEARCH_URL: http://opensearch:9200
      SEARCH_REINDEX_ON_STARTUP: ${SEARCH_REINDEX_ON_STARTUP:-true}
    ports:
      - "8084:8084"
    networks:
      - orderflow-network

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: orderflow-api-gateway
    restart: unless-stopped
    depends_on:
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      customer-service:
        condition: service_started
      search-service:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      CUSTOMER_SERVICE_URL: http://customer-service:8085
      SEARCH_SERVICE_URL: http://search-service:8084
      AUTH_EXTERNAL_ISSUER_URI: http://localhost:8180/realms/oflio
      AUTH_INTERNAL_JWK_SET_URI: http://keycloak:8080/realms/oflio/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    networks:
      - orderflow-network

  portal-ui:
    build:
      context: ./frontend/portal-ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_AUTH_URL: http://localhost:8180
        VITE_AUTH_REALM: oflio
        VITE_AUTH_CLIENT_ID: oflio-portal-ui
        VITE_REQUIRED_SCOPE: customer
    container_name: orderflow-portal-ui
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "${PORTAL_UI_PORT:-5173}:80"
    networks:
      - orderflow-network

  admin-ui:
    build:
      context: ./frontend/admin-ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_AUTH_URL: http://localhost:8180
        VITE_AUTH_REALM: oflio
        VITE_AUTH_CLIENT_ID: oflio-admin-ui
        VITE_REQUIRED_SCOPE: admin
    container_name: orderflow-admin-ui
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "${ADMIN_UI_PORT:-5174}:80"
    networks:
      - orderflow-network

networks:
  orderflow-network:
    driver: bridge

volumes:
  product-db-data:
  order-db-data:
  customer-db-data:
  keycloak-db-data:
  kafka-data:
  opensearch-data:
