name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build backend services
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew clean test bootJar

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/portal-ui/package-lock.json
            frontend/admin-ui/package-lock.json

      - name: Install portal-ui dependencies
        working-directory: frontend/portal-ui
        run: npm ci

      - name: Build portal-ui
        working-directory: frontend/portal-ui
        run: npm run build

      - name: Install admin-ui dependencies
        working-directory: frontend/admin-ui
        run: npm ci

      - name: Build admin-ui
        working-directory: frontend/admin-ui
        run: npm run build
