<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <th:block th:fragment="styles">
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #eef3f8;
        color: #0f172a;
        font-family: Arial, Helvetica, sans-serif;
      }

      .email-shell {
        width: 100%;
        background: linear-gradient(180deg, #eef4ff 0%, #eef3f8 100%);
        padding: 32px 16px;
      }

      .email-card {
        max-width: 680px;
        margin: 0 auto;
        border-radius: 28px;
        overflow: hidden;
        background: #ffffff;
        box-shadow: 0 24px 54px rgba(15, 23, 42, 0.12);
      }

      .email-body {
        padding: 32px;
      }

      .metric-grid {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      .metric-grid td {
        padding: 14px 0;
        border-bottom: 1px solid #e2e8f0;
        font-size: 14px;
      }

      .metric-grid td:first-child {
        color: #64748b;
      }

      .metric-grid td:last-child {
        text-align: right;
        font-weight: 700;
        color: #0f172a;
      }

      .action-row {
        padding-top: 24px;
      }

      .action-pill {
        display: inline-block;
        padding: 14px 22px;
        border-radius: 999px;
        background: #ffcd38;
        color: #0f172a;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }

      .notice {
        margin-top: 24px;
        border-radius: 20px;
        background: #f8fafc;
        border: 1px solid #dbe4f0;
        padding: 18px 20px;
        font-size: 14px;
        line-height: 1.7;
        color: #334155;
      }

      .section-title {
        margin: 30px 0 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #475569;
      }

      .line-items {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        overflow: hidden;
      }

      .line-items th {
        padding: 12px 14px;
        background: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #64748b;
        text-align: left;
      }

      .line-items td {
        padding: 14px;
        border-bottom: 1px solid #e2e8f0;
        font-size: 14px;
        color: #0f172a;
        vertical-align: middle;
      }

      .line-items tr:last-child td {
        border-bottom: 0;
      }

      .line-items .numeric {
        text-align: right;
        white-space: nowrap;
      }

      .item-media {
        width: 100%;
        border-collapse: collapse;
      }

      .item-thumb-cell {
        width: 56px;
      }

      .item-thumb {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        display: block;
        background: #eef4ff;
      }

      .item-name {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.5;
        color: #0f172a;
      }

      .item-meta {
        margin: 4px 0 0;
        font-size: 12px;
        color: #64748b;
      }

      .summary-card {
        margin-top: 22px;
        margin-left: auto;
        width: 100%;
        max-width: 320px;
        border: 1px solid #dbe4f0;
        border-radius: 20px;
        background: #f8fafc;
        padding: 18px 18px 10px;
      }

      .summary-grid {
        width: 100%;
        border-collapse: collapse;
      }

      .summary-grid td {
        padding: 10px 0;
        font-size: 14px;
        color: #334155;
      }

      .summary-grid td:last-child {
        text-align: right;
        font-weight: 700;
        color: #0f172a;
        white-space: nowrap;
      }

      .summary-grid .total-row td {
        border-top: 1px solid #cbd5e1;
        padding-top: 16px;
        font-size: 18px;
        font-weight: 800;
        color: #020617;
      }

      .eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #dbeafe;
      }

      .hero-title {
        margin: 18px 0 0;
        font-size: 34px;
        line-height: 1.1;
        color: #ffffff;
      }

      .hero-copy {
        margin: 16px 0 0;
        font-size: 16px;
        line-height: 1.7;
        color: #dbeafe;
      }

      @media only screen and (max-width: 640px) {
        .email-shell {
          padding: 16px 10px;
        }

        .email-body {
          padding: 24px 18px;
        }

        .hero-title {
          font-size: 28px;
        }

        .metric-grid td {
          display: block;
          text-align: left;
          padding: 8px 0;
        }

        .metric-grid td:last-child {
          text-align: left;
          padding-top: 0;
        }

        .line-items th {
          display: none;
        }

        .line-items td {
          display: block;
          padding: 10px 14px;
          text-align: left;
        }

        .line-items .numeric {
          text-align: left;
        }

        .summary-card {
          max-width: none;
        }
      }
    </style>
  </th:block>
</html>
