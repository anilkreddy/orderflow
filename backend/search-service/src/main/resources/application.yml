server:
  port: 8084

spring:
  application:
    name: search-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: search-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.orderflow.search.messaging
management:
  endpoints:
    web:
      exposure:
        include: health,info

application:
  kafka:
    product-upserted-topic: product.upserted
    product-deleted-topic: product.deleted
  clients:
    product-service:
      base-url: ${PRODUCT_SERVICE_BASE_URL:http://localhost:8081}
  search:
    opensearch:
      url: ${OPENSEARCH_URL:http://localhost:9200}
    index:
      products-name: ${OPENSEARCH_PRODUCTS_INDEX_NAME:products_v1}
      products-read-alias: ${OPENSEARCH_PRODUCTS_READ_ALIAS:products_read}
      products-write-alias: ${OPENSEARCH_PRODUCTS_WRITE_ALIAS:products_write}
    reindex-on-startup: ${SEARCH_REINDEX_ON_STARTUP:true}
    reindex-startup-max-attempts: ${SEARCH_REINDEX_STARTUP_MAX_ATTEMPTS:15}
    reindex-startup-delay-ms: ${SEARCH_REINDEX_STARTUP_DELAY_MS:4000}
    tuning:
      synonyms:
        - tv, television, smart tv
        - phone, smartphone, mobile
        - laptop, notebook, ultrabook
        - headphones, headset, earbuds
        - fridge, refrigerator
        - sofa, couch
        - sneakers, trainers, running shoes
        - shampoo, hair cleanser
        - planner, journal, notebook
        - pet bed, dog bed, cat bed
      boosts:
        exact-name: 8.0
        phrase-prefix: 5.0
        category: 2.4
        keywords: 4.2
        description: 1.3
      weights:
        popularity-factor: 0.08
        in-stock: 1.15
        active: 1.05
      price-bands:
        - code: under-25
          label: Under $25
          max-price: 25
          upper-exclusive: true
        - code: 25-50
          label: $25 to $50
          min-price: 25
          max-price: 50
          upper-exclusive: true
        - code: 50-100
          label: $50 to $100
          min-price: 50
          max-price: 100
          upper-exclusive: true
        - code: 100-250
          label: $100 to $250
          min-price: 100
          max-price: 250
          upper-exclusive: true
        - code: 250-plus
          label: $250 and above
          min-price: 250
          upper-exclusive: false

logging:
  level:
    com.orderflow.search: INFO
    org.springframework.web: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
